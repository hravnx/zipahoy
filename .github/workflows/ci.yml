name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

# a new push to a PR makes the in-flight run pointless, so drop it
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # the library special-cases path separators, so the tests are only meaningful
    # if they run somewhere the separator is a backslash as well
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ZipAhoy.sln

      - name: Build
        run: dotnet build ZipAhoy.sln --configuration Release --no-restore -warnaserror

      # on windows this runs the suite twice, once per test target framework, so the trx name is
      # left at its default - a fixed one would have the two runs overwrite each other
      - name: Test
        id: test
        run: dotnet test ZipAhoy.sln --configuration Release --no-build --logger trx

      # uploaded on failure too - that is when the results are actually worth reading. Skipped
      # when the build never got as far as testing, so it can't fail for having nothing to upload.
      - name: Upload test results
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/*.trx'
          if-no-files-found: error

  # the package is platform independent, so it is built once rather than per matrix leg, and
  # only once the tests have passed on all of them
  pack:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Pack
        run: dotnet pack src/lib/ZipAhoy.csproj --configuration Release -warnaserror --output artifacts

      # packing succeeds even if a target framework silently stops being included, so the
      # things consumers actually depend on are asserted rather than assumed
      - name: Check package contents
        run: |
          package=$(ls artifacts/*.nupkg)
          echo "inspecting $package"
          contents=$(unzip -Z1 "$package")
          echo "$contents"
          missing=0
          for expected in \
            lib/netstandard2.0/ZipAhoy.dll \
            lib/netstandard2.0/ZipAhoy.xml \
            lib/net10.0/ZipAhoy.dll \
            lib/net10.0/ZipAhoy.xml \
            README.md
          do
            if ! printf '%s\n' "$contents" | grep -qxF "$expected"; then
              echo "::error::package is missing $expected"
              missing=1
            fi
          done
          exit $missing

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: nuget-package
          path: artifacts/*
          if-no-files-found: error
